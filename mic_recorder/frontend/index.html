<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --st-bg: #ffffff;
    --st-secondary-bg: #f0f2f6;
    --st-primary: #ff4b4b;
    --st-text: #31333f;
    --st-font: -apple-system, "Segoe UI", sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--st-font);
    background: transparent;
  }

  .bar {
    display: flex;
    align-items: center;
    height: 52px;
    border-radius: 26px;
    background: var(--st-secondary-bg);
    border: 1px solid color-mix(in srgb, var(--st-text) 15%, transparent);
    padding: 0 6px 0 16px;
    box-sizing: border-box;
    overflow: hidden;
  }

  .bar.recording {
    border-color: color-mix(in srgb, var(--st-primary) 45%, transparent);
  }

  .timer {
    font-size: 14px;
    color: var(--st-text);
    min-width: 44px;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .bar.recording .timer {
    opacity: 1;
    transform: translateX(0);
  }

  .waveform {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 3px;
    margin-left: 10px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .bar.recording .waveform {
    opacity: 1;
  }

  .wave-bar {
    width: 3px;
    height: 8px;
    border-radius: 2px;
    background: var(--st-primary);
    animation: pulse 0.9s ease-in-out infinite;
  }

  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  .wave-bar:nth-child(6) { animation-delay: 0.5s; }
  .wave-bar:nth-child(7) { animation-delay: 0.6s; }

  @keyframes pulse {
    0%, 100% { height: 8px; }
    50% { height: 24px; }
  }

  .hint {
    flex: 1;
    font-size: 14px;
    color: var(--st-text);
    opacity: 0.6;
  }

  .bar.recording .hint {
    display: none;
  }

  .mic-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--st-primary);
    transition: background 0.2s ease;
  }

  .mic-btn.stop {
    background: #e05353;
  }

  .mic-btn:hover {
    filter: brightness(1.08);
  }

  .status {
    font-size: 12px;
    color: #e05353;
    margin-top: 4px;
    padding-left: 16px;
    min-height: 14px;
  }
</style>
</head>
<body>

<div class="bar" id="bar">
  <span class="timer" id="timer">0:00</span>
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>
  <span class="hint" id="hint">Tap the mic to ask a question</span>
  <button class="mic-btn" id="micBtn" title="Record">
    <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="white">
      <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
      <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
    </svg>
  </button>
</div>
<div class="status" id="status"></div>

<script>
  // Minimal implementation of Streamlit's bidirectional component
  // postMessage protocol (no bundler / CDN dependency).
  function sendToStreamlit(type, extra) {
    window.parent.postMessage(Object.assign({
      isStreamlitMessage: true,
      type: type
    }, extra || {}), "*");
  }

  function setFrameHeight() {
    sendToStreamlit("streamlit:setFrameHeight", { height: document.body.scrollHeight + 10 });
  }

  // Pin the mic bar to the bottom of the outer app viewport. We don't
  // rely on guessing Streamlit's internal wrapper class/testid names
  // (those change across versions) - since this iframe is same-origin,
  // we reach into window.frameElement directly and style the real
  // wrapper element that Streamlit put around us.
  function pinToBottom() {
    try {
      const frame = window.frameElement;
      if (!frame) return;

      frame.style.border = "none";
      frame.style.display = "block";

      let wrapper = frame.parentElement;
      for (let i = 0; i < 3 && wrapper && wrapper.parentElement; i++) {
        wrapper.style.position = "fixed";
        wrapper.style.bottom = "0";
        wrapper.style.left = "0";
        wrapper.style.right = "0";
        wrapper.style.maxWidth = "736px";
        wrapper.style.width = "calc(100% - 2rem)";
        wrapper.style.margin = "0 auto";
        wrapper.style.padding = "0.75rem 0";
        wrapper.style.zIndex = "999";
        wrapper.style.background = "transparent";

        const cs = window.getComputedStyle(wrapper);
        if (cs.position === "fixed") break;
        wrapper = wrapper.parentElement;
      }
    } catch (e) {
      // Cross-origin or unavailable - silently skip; the bar will
      // just render inline instead of pinned.
    }
  }

  function applyTheme(theme) {
    if (!theme) return;
    const root = document.documentElement.style;
    if (theme.backgroundColor) root.setProperty("--st-bg", theme.backgroundColor);
    if (theme.secondaryBackgroundColor) root.setProperty("--st-secondary-bg", theme.secondaryBackgroundColor);
    if (theme.primaryColor) root.setProperty("--st-primary", theme.primaryColor);
    if (theme.textColor) root.setProperty("--st-text", theme.textColor);
    if (theme.font) root.setProperty("--st-font", theme.font);
  }

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (data && data.type === "streamlit:render") {
      applyTheme(data.theme);
      pinToBottom();
    }
  });

  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  window.addEventListener("load", () => {
    setFrameHeight();
    pinToBottom();
  });

  const bar = document.getElementById("bar");
  const micBtn = document.getElementById("micBtn");
  const micIcon = document.getElementById("micIcon");
  const timerEl = document.getElementById("timer");
  const statusEl = document.getElementById("status");

  const STOP_ICON = '<rect x="6" y="6" width="12" height="12" rx="2" fill="white"/>';
  const MIC_ICON = document.getElementById("micIcon").innerHTML;

  let mediaRecorder = null;
  let chunks = [];
  let startTime = null;
  let timerInterval = null;
  let recording = false;

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  async function startRecording() {
    statusEl.textContent = "";
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      statusEl.textContent = "Microphone permission denied.";
      return;
    }

    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunks, { type: "audio/webm" });
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(",")[1];
        sendToStreamlit("streamlit:setComponentValue", {
          value: { audio_base64: base64, mime: "audio/webm", timestamp: Date.now() },
          dataType: "json"
        });
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    recording = true;
    startTime = Date.now();
    bar.classList.add("recording");
    micIcon.innerHTML = STOP_ICON;
    micBtn.classList.add("stop");
    micBtn.title = "Stop";

    timerInterval = setInterval(() => {
      timerEl.textContent = formatTime(Date.now() - startTime);
    }, 250);
  }

  function stopRecording() {
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
    }
    recording = false;
    clearInterval(timerInterval);
    bar.classList.remove("recording");
    micIcon.innerHTML = MIC_ICON;
    micBtn.classList.remove("stop");
    micBtn.title = "Record";
    timerEl.textContent = "0:00";
  }

  micBtn.addEventListener("click", () => {
    if (recording) {
      stopRecording();
    } else {
      startRecording();
    }
  });
</script>
</body>
</html>
